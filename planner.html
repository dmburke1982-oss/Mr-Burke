const plannerRoute = readPlannerRoute();
let activeCourse = plannerRoute.course;
let state = loadState();
let editingId = null;
let hasAppliedInitialRouteFocus = false;

function loadState() {
  const fallback = buildDefaultState();
  const saved = localStorage.getItem('cteHubPlanner_v3');
  if (!saved) return fallback;

  try {
    const parsed = JSON.parse(saved);
    if (isValidState(parsed)) return parsed;
    setSyncMessage('Recovered from invalid saved planner data');
  } catch (err) {
    setSyncMessage('Recovered from unreadable saved planner data');
  }
  return fallback;
}

function initCourse(src) {
  return src.map((s, i) => {
    const prefill = (src === wwSchedule ? wwPrefill : gdPrefill)[s.day] || {};
    return {
      id: `D${i}`, ...s,
      objective: prefill.objective || '',
      materials: prefill.materials || '',
      warmup: prefill.warmup || '',
      miniLesson: prefill.miniLesson || '',
      exitCheck: prefill.exitCheck || '',
      notes: prefill.notes || '',
      status: s.holiday ? 'holiday' : (prefill.status || 'draft')
    };
  });
}

function buildDefaultState() {
  return { ww: initCourse(wwSchedule), gd: initCourse(gdSchedule) };
}

function isValidState(candidate) {
  return !!candidate
    && typeof candidate === 'object'
    && Array.isArray(candidate.ww)
    && Array.isArray(candidate.gd)
    && candidate.ww.length === wwSchedule.length
    && candidate.gd.length === gdSchedule.length;
}

function save() {
  try {
    localStorage.setItem('cteHubPlanner_v3', JSON.stringify(state));
    setSyncMessage('Saved ' + new Date().toLocaleTimeString());
  } catch (err) {
    setSyncMessage('Save blocked in this browser');
  }
}

function current() { return state[activeCourse]; }
function weeksMeta() { return activeCourse === 'ww' ? WEEKS_META : GD_WEEKS_META; }
function themeColor() { return activeCourse === 'ww' ? 'amber' : 'indigo'; }

function readPlannerRoute() {
  const params = new URLSearchParams(window.location.search);
  return {
    course: resolveCourseParam(params.get('course')),
    week: parseWeekParam(params.get('week')),
    date: normalizeDateParam(params.get('date'))
  };
}

function resolveCourseParam(value) {
  if (value === 'graphicDesign' || value === 'gd') return 'gd';
  return 'ww';
}

function parseWeekParam(value) {
  const num = Number(value);
  return Number.isInteger(num) && num > 0 ? num : null;
}

function normalizeDateParam(value) {
  return /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value : null;
}

function serialiseCourseParam(value) {
  return value === 'gd' ? 'graphicDesign' : 'woodworking';
}

function updatePlannerRoute(next = {}) {
  const params = new URLSearchParams(window.location.search);
  const nextCourse = next.course ?? activeCourse;
  const nextWeek = Object.prototype.hasOwnProperty.call(next, 'week') ? next.week : plannerRoute.week;
  const nextDate = Object.prototype.hasOwnProperty.call(next, 'date') ? next.date : plannerRoute.date;

  params.set('course', serialiseCourseParam(nextCourse));
  if (nextWeek) params.set('week', String(nextWeek));
  else params.delete('week');
  if (nextDate) params.set('date', nextDate);
  else params.delete('date');

  const query = params.toString();
  const nextUrl = `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash || ''}`;
  window.history.replaceState({}, '', nextUrl);

  plannerRoute.course = resolveCourseParam(params.get('course'));
  plannerRoute.week = parseWeekParam(params.get('week'));
  plannerRoute.date = normalizeDateParam(params.get('date'));
}

function plannerDayLabelFromIso(isoDate) {
  if (!isoDate) return '';
  const date = new Date(`${isoDate}T12:00:00`);
  if (Number.isNaN(date.getTime())) return '';
  const weekday = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
  return `${weekday} ${date.getMonth() + 1}/${date.getDate()}`;
}

// ─────────────────────────────────────────
// 4. RENDER GRID
// ─────────────────────────────────────────
const colorMap = { amber: { badge:'bg-amber-600', dot:'bg-amber-500', text:'text-amber-400', border:'border-amber-500/40', ring:'ring-amber-500' }, indigo: { badge:'bg-indigo-600', dot:'bg-indigo-500', text:'text-indigo-400', border:'border-indigo-500/40', ring:'ring-indigo-500' } };

function renderGrid() {
  const c = colorMap[themeColor()];
  const grid = document.getElementById('gridView');
  const routeDayLabel = plannerDayLabelFromIso(plannerRoute.date);
  let focusTarget = null;
  grid.innerHTML = '';
  const weeks = [...new Set(current().map(d => d.wk))];
  weeks.forEach(wk => {
    const sec = document.createElement('section');
    sec.className = 'space-y-4 fade-in';
    if (!hasAppliedInitialRouteFocus && plannerRoute.week === wk) {
      sec.classList.add('rounded-[2rem]', 'ring-1', 'ring-slate-700', 'p-4');
      focusTarget = sec;
    }
    const meta = weeksMeta()[wk] || '';
    sec.innerHTML = `
      <div class="flex items-end justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="text-[10px] font-black uppercase tracking-[0.4em] ${c.text}">Module ${wk}</span>
          <p class="text-sm font-semibold text-slate-400 mt-0.5 max-w-2xl leading-snug">${meta}</p>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4" id="week_${wk}"></div>
    `;
    grid.appendChild(sec);
    const row = sec.querySelector(`#week_${wk}`);
    current().filter(d => d.wk === wk).forEach(day => {
      const card = document.createElement('div');
      const isHoliday = day.holiday;
      card.className = `h-44 p-4 rounded-2xl border flex flex-col transition-all duration-200 ${isHoliday ? 'opacity-30 grayscale border-slate-800 bg-slate-900/30' : `bg-slate-900 border-slate-800 hover:${c.border} hover:-translate-y-1 hover:shadow-xl cursor-pointer group`}`;
      card.dataset.dayLabel = day.day;
      if (!hasAppliedInitialRouteFocus && routeDayLabel && day.day === routeDayLabel) {
        card.classList.add('ring-2', 'ring-indigo-500', 'shadow-xl');
        focusTarget = card;
      }
      card.innerHTML = `
        <span class="text-[9px] font-bold text-slate-500 mb-1">${esc(day.day)}</span>
        <h3 class="text-sm font-black text-white leading-snug group-hover:${c.text} transition-colors line-clamp-2">${esc(day.title)}</h3>
        <p class="text-[10px] text-slate-400 mt-2 line-clamp-3 italic flex-grow">${formatPlannerText(day.objective || day.task)}</p>
        <div class="flex items-center justify-between mt-auto pt-2 border-t border-slate-800">
          <div class="w-2 h-2 rounded-full ${day.status==='locked'?'bg-blue-500':day.status==='done'?'bg-emerald-500':'bg-slate-700'}"></div>
          <span class="text-[8px] font-black uppercase text-slate-600">${esc(day.status)}</span>
        </div>
      `;
      if (!isHoliday) card.onclick = () => openEdit(day.id);
      row.appendChild(card);
    });
  });
  // Build print view
  buildPrintView();
  if (!hasAppliedInitialRouteFocus) {
    hasAppliedInitialRouteFocus = true;
    if (focusTarget) {
      requestAnimationFrame(() => {
        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
  }
}

// 4. EDIT PANEL
// ─────────────────────────────────────────
function openEdit(id) {
  editingId = id;
  const day = current().find(d => d.id === id);
  const c = colorMap[themeColor()];
  const content = document.getElementById('editContent');
  content.innerHTML = `
    <div class="flex items-center gap-3 mb-2">
      <span class="text-[10px] font-black uppercase tracking-widest bg-slate-800 text-slate-400 px-3 py-1 rounded-full">${day.day}</span>
      <span class="text-[10px] font-black uppercase tracking-widest ${c.text}">Module ${day.wk}</span>
    </div>
    <input id="ef_title" value="${esc(day.title)}" class="w-full bg-transparent border-none p-0 text-4xl font-black text-white focus:ring-0 outline-none mb-8"/>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      ${editField('ef_objective','Learning Objective', day.objective, 'Describe the student-facing learning target...')}
      ${editField('ef_wgllt','Success Criteria (WGLL)', day.wgllt, 'What does success look like today?', true)}
      ${editField('ef_task','Studio Task', day.task, 'Daily task from master schedule...', false, true)}
      ${editField('ef_warmup','Warm-Up / Hook', day.warmup, 'Engagement activity or question...')}
      ${editField('ef_miniLesson','Direct Instruction / Demo Plan', day.miniLesson, 'Teacher-led instruction notes...')}
      ${editField('ef_materials','Materials & Resources', day.materials, 'What is needed today?')}
      ${editField('ef_exitCheck','Exit Check / Reflection', day.exitCheck, 'How will you check for understanding?')}
      ${editField('ef_notes','Teacher Notes', day.notes, 'Private planning notes...')}
    </div>
    <div class="flex items-center gap-3 mt-8 pt-6 border-t border-slate-800">
      <button onclick="saveEdit()" class="flex-1 py-3.5 rounded-xl ${c.badge} text-white font-black uppercase tracking-widest text-sm hover:opacity-90 transition">Save Changes</button>
      <button onclick="toggleStatus()" class="px-6 py-3.5 rounded-xl border border-slate-700 text-slate-400 hover:text-white font-black uppercase tracking-widest text-[10px] transition" id="statusBtn">${statusLabel(day.status)}</button>
    </div>
  `;
  document.getElementById('editPanel').classList.remove('hidden');
}

function editField(id, label, value, placeholder, highlight=false, full=false) {
  const c = colorMap[themeColor()];
  const colSpan = full ? 'md:col-span-2' : '';
  const bg = highlight ? 'bg-white/5 border border-slate-700/50' : 'bg-slate-800/60';
  const lbl = highlight ? `${c.text}` : 'text-slate-500';
  return `
    <div class="space-y-2 ${colSpan}">
      <label class="text-[10px] font-black uppercase tracking-[0.2em] ${lbl}">${label}</label>
      <textarea id="${id}" placeholder="${placeholder}" class="${bg} w-full border-none rounded-2xl p-4 text-sm font-medium outline-none focus:ring-2 focus:ring-slate-600 min-h-[90px] transition resize-none text-slate-200">${esc(value)}</textarea>
    </div>`;
}

function saveEdit() {
  const day = current().find(d => d.id === editingId);
  if (!day) return;
  ['title','objective','wgllt','task','warmup','miniLesson','materials','exitCheck','notes'].forEach(k => {
    const el = document.getElementById(`ef_${k}`);
    if (el) day[k] = el.value;
  });
  if (day.status === 'draft' && day.objective.trim()) day.status = 'ready';
  save();
  closeEdit();
  renderGrid();
}

function toggleStatus() {
  const day = current().find(d => d.id === editingId);
  if (!day) return;
  const seq = ['draft','ready','locked','done'];
  const idx = seq.indexOf(day.status);
  day.status = seq[(idx+1)%seq.length];
  document.getElementById('statusBtn').textContent = statusLabel(day.status);
  save();
}

function statusLabel(s) {
  return { draft:'Mark Ready', ready:'Lock Plan', locked:'Mark Done', done:'Reset Draft' }[s] || 'Set Status';
}

function closeEdit() {
  document.getElementById('editPanel').classList.add('hidden');
  editingId = null;
}

// ─────────────────────────────────────────
// 5. COURSE SWITCHER
// ─────────────────────────────────────────
function openPrintablePlanner() {
  const params = new URLSearchParams();
  params.set('course', serialiseCourseParam(activeCourse));
  if (plannerRoute.week) params.set('week', String(plannerRoute.week));
  if (plannerRoute.date) params.set('date', plannerRoute.date);
  const query = params.toString();
  window.location.href = `teaching-planner.html${query ? `?${query}` : ''}`;
}

function syncCourseTabs() {
  const wwTab = document.getElementById('wwTab');
  const gdTab = document.getElementById('gdTab');
  if (activeCourse === 'ww') {
    wwTab.className = 'px-4 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition bg-amber-600 text-white shadow';
    gdTab.className = 'px-4 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition text-slate-400 hover:text-white';
  } else {
    gdTab.className = 'px-4 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition bg-indigo-600 text-white shadow';
    wwTab.className = 'px-4 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition text-slate-400 hover:text-white';
  }
}

function switchCourse(c) {
  if (activeCourse === c) return;
  activeCourse = c;
  hasAppliedInitialRouteFocus = false;
  updatePlannerRoute({ course: c });
  syncCourseTabs();
  renderGrid();
}

function resetCourse() {
  if (!confirm(`Reset ${activeCourse.toUpperCase()} planner? All edits will be lost.`)) return;
  state[activeCourse] = initCourse(activeCourse === 'ww' ? wwSchedule : gdSchedule);
  save();
  renderGrid();
}

// ─────────────────────────────────────────
// 7. UTILS
// ─────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatPlannerText(s) { return esc(s).replace(/\r?\n/g, '<br/>'); }
function setSyncMessage(message) {
  document.getElementById('syncLabel').textContent = message;
}

// INIT — patch prefill into any existing saved state that has blank fields
function applyPrefillPatch() {
  const patchMap = { ww: wwPrefill, gd: gdPrefill };
  ['ww','gd'].forEach(course => {
    const prefills = patchMap[course];
    state[course].forEach(day => {
      const pf = prefills[day.day];
      if (!pf) return;
      if (!day.objective) day.objective = pf.objective;
      if (!day.materials) day.materials = pf.materials;
      if (!day.warmup)    day.warmup    = pf.warmup;
      if (!day.miniLesson) day.miniLesson = pf.miniLesson;
      if (!day.exitCheck)  day.exitCheck  = pf.exitCheck;
      if (!day.notes)      day.notes      = pf.notes;
      if (day.status === 'draft' && pf.status) day.status = pf.status;
    });
  });
  save();
}

const CHECKPOINT_STORAGE_KEY = 'cteHubCheckpointTracker_v1';
const checkpointBlueprint = [
  {
    title: 'Woodworking',
    accent: 'amber',
    items: [
      { id: 'ww_w12', week: '12', label: 'Workflow + Cut List', detail: 'Sketches approved, cut lists checked, and staggered workflow understood.' },
      { id: 'ww_w13', week: '13', label: 'Joinery + Glue-Up', detail: 'Rabbets, bottom panel math, and box glue-up completed safely.' },
      { id: 'ww_w16', week: '16', label: 'Review + Reflection', detail: 'Peer review, targeted improvements, and project reflection finished.' }
    ]
  },
  {
    title: 'Graphic Design',
    accent: 'indigo',
    items: [
      { id: 'gd_w12', week: '12', label: 'Brand Consistency Export', detail: 'Album cover and merch pieces align visually and export cleanly.' },
      { id: 'gd_w13', week: '13', label: 'GMetrix Setup + Revision', detail: 'Student login works, critique is recorded, and revision checkpoint is met.' },
      { id: 'gd_w16', week: '16', label: 'Targeted Review Readiness', detail: 'Weak-area review, packaging, and exam strategy prep are ready.' }
    ]
  }
];

function buildCheckpointDefaults() {
  const out = {};
  checkpointBlueprint.forEach(group => {
    group.items.forEach(item => {
      out[item.id] = { status: 'not-started', note: '' };
    });
  });
  return out;
}

function loadCheckpointState() {
  try {
    const raw = localStorage.getItem(CHECKPOINT_STORAGE_KEY);
    if (!raw) return buildCheckpointDefaults();
    return { ...buildCheckpointDefaults(), ...JSON.parse(raw) };
  } catch (err) {
    return buildCheckpointDefaults();
  }
}

let checkpointState = loadCheckpointState();

function saveCheckpointState() {
  try {
    localStorage.setItem(CHECKPOINT_STORAGE_KEY, JSON.stringify(checkpointState));
  } catch (err) {
    setSyncMessage('Checkpoint save blocked in this browser');
  }
}

function checkpointAccent(accent) {
  return accent === 'amber'
    ? {
        pill: 'bg-amber-500/10 border-amber-500/20 text-amber-300',
        focus: 'focus:border-amber-500 focus:ring-amber-500/30'
      }
    : {
        pill: 'bg-indigo-500/10 border-indigo-500/20 text-indigo-300',
        focus: 'focus:border-indigo-500 focus:ring-indigo-500/30'
      };
}

function checkpointStatusTone(status) {
  if (status === 'done') return 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20';
  if (status === 'in-progress') return 'bg-amber-500/10 text-amber-300 border border-amber-500/20';
  return 'bg-slate-800 text-slate-300 border border-slate-700';
}

function renderCheckpointTables() {
  const mount = document.getElementById('checkpointTables');
  if (!mount) return;
  mount.innerHTML = checkpointBlueprint.map(group => {
    const accent = checkpointAccent(group.accent);
    return `
      <section class="rounded-[2rem] border border-slate-800 bg-slate-950 p-5 md:p-6">
        <div class="flex items-center justify-between gap-3 mb-5">
          <div>
            <p class="text-[10px] font-black uppercase tracking-[0.35em] text-slate-500 mb-2">${group.title} milestones</p>
            <h3 class="text-xl font-black text-white">${group.title}</h3>
          </div>
          <span class="px-3 py-1.5 rounded-full border text-xs font-black uppercase tracking-[0.25em] ${accent.pill}">Weeks 12 · 13 · 16</span>
        </div>
        <div class="space-y-3">
          ${group.items.map(item => {
            const entry = checkpointState[item.id] || { status: 'not-started', note: '' };
            const safeNote = (entry.note || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `
              <div class="rounded-2xl border border-slate-800 bg-slate-900 p-4">
                <div class="flex flex-col gap-3">
                  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
                    <div>
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="px-2.5 py-1 rounded-full bg-slate-800 text-[10px] font-black uppercase tracking-[0.25em] text-slate-300">Week ${item.week}</span>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.25em] ${checkpointStatusTone(entry.status)}">${entry.status.replace('-', ' ')}</span>
                      </div>
                      <h4 class="text-base font-black text-white mt-3">${item.label}</h4>
                      <p class="text-sm text-slate-400 mt-1">${item.detail}</p>
                    </div>
                    <label class="text-xs font-black uppercase tracking-[0.25em] text-slate-500">
                      Status
                      <select data-checkpoint-id="${item.id}" data-field="status" class="mt-2 w-full md:w-44 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 px-3 py-2 text-sm font-semibold outline-none focus:ring-2 ${accent.focus}">
                        <option value="not-started" ${entry.status === 'not-started' ? 'selected' : ''}>Not started</option>
                        <option value="in-progress" ${entry.status === 'in-progress' ? 'selected' : ''}>In progress</option>
                        <option value="done" ${entry.status === 'done' ? 'selected' : ''}>Done</option>
                      </select>
                    </label>
                  </div>
                  <label class="text-xs font-black uppercase tracking-[0.25em] text-slate-500">
                    Evidence / notes
                    <textarea data-checkpoint-id="${item.id}" data-field="note" rows="2" class="mt-2 w-full rounded-2xl bg-slate-950 border border-slate-700 text-slate-100 px-4 py-3 text-sm font-medium outline-none focus:ring-2 ${accent.focus}" placeholder="What did students complete or what still needs attention?">${safeNote}</textarea>
                  </label>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    `;
  }).join('');
}

document.addEventListener('input', (event) => {
  const target = event.target;
  if (!(target instanceof HTMLElement)) return;
  const checkpointId = target.dataset ? target.dataset.checkpointId : '';
  const field = target.dataset ? target.dataset.field : '';
  if (!checkpointId || !field) return;
  checkpointState[checkpointId] = checkpointState[checkpointId] || { status: 'not-started', note: '' };
  checkpointState[checkpointId][field] = target.value;
  saveCheckpointState();
  if (field === 'status') renderCheckpointTables();
});

document.addEventListener('click', (event) => {
  const target = event.target;
  if (!(target instanceof HTMLElement)) return;
  const btn = target.closest('#checkpointResetBtn');
  if (!btn) return;
  if (!confirm('Reset all checkpoint statuses and notes?')) return;
  checkpointState = buildCheckpointDefaults();
  saveCheckpointState();
  renderCheckpointTables();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !document.getElementById('editPanel').classList.contains('hidden')) {
    closeEdit();
  }
});

updatePlannerRoute({ course: activeCourse, week: plannerRoute.week, date: plannerRoute.date });
applyPrefillPatch();
renderCheckpointTables();
syncCourseTabs();
renderGrid();
</script>
