<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GD Slides — Campaign & ACE · Mr. Burke</title>
<link rel="stylesheet" href="./assets/tailwind.local.css"/>
<link rel="stylesheet" href="./assets/classroom-base.css"/>
<style>
  body { font-family: var(--app-sans); background: #020617; }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  .slide-enter { animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes slideUp { from { opacity:0; transform:translateY(24px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
</style>
</head>
<body class="text-slate-100 overflow-hidden">

<div class="flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-72 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 z-50 transition-transform duration-300 -translate-x-full md:relative md:translate-x-0">
    <div class="px-6 py-5 border-b border-slate-800 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2 mb-0.5">
          <svg class="text-indigo-400" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <h2 class="text-base font-black text-indigo-400">Graphic Design</h2>
        </div>
        <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Campaign + ACE Cert</p>
      </div>
      <button id="closeSidebar" class="md:hidden text-slate-400 hover:text-white p-1">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-5" id="navList"></div>
    <div class="px-4 py-3 border-t border-slate-800">
      <a href="index.html" class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-500 hover:text-white transition">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Back to Hub
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col min-w-0">
    <header class="h-14 flex items-center justify-between px-6 bg-slate-900/40 backdrop-blur-md border-b border-slate-800/50 shrink-0">
      <button id="openSidebar" class="md:hidden p-2 text-slate-400 hover:text-white">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="flex items-center gap-3">
        <span id="weekBadge" class="px-3 py-1 bg-slate-800 rounded-full text-xs font-bold text-slate-300"></span>
        <span id="dateBadge" class="text-slate-500 text-sm font-medium"></span>
      </div>
      <div class="flex items-center gap-3">
        <a href="https://www.gmetrix.net/" target="_blank" rel="noreferrer" class="hidden lg:inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200 hover:border-indigo-500/40 hover:text-white transition">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          GMetrix
        </a>
        <a href="https://support.gmetrix.net/support/home" target="_blank" rel="noreferrer" class="hidden xl:inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs font-bold text-slate-200 hover:border-indigo-500/40 hover:text-white transition">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 1 1 5.82 1c0 2-3 2-3 4"/><path d="M12 17h.01"/></svg>
          Support
        </a>
        <a href="https://support.gmetrix.net/support/solutions/folders/67000581285" target="_blank" rel="noreferrer" class="hidden xl:inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-xs font-bold text-indigo-300 hover:bg-indigo-500/20 transition">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Study Guide
        </a>
        <a href="planner.html#checkpointTracker" class="hidden lg:inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-xs font-bold text-emerald-300 hover:bg-emerald-500/20 transition">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></svg>
          Checkpoints
        </a>
        <a href="video-gd.html" class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-xs font-bold text-indigo-300 hover:bg-indigo-500/20 transition">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="9 7 17 12 9 17 9 7"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
          Video Resource
        </a>
        <span id="counterBadge" class="text-slate-500 text-sm font-mono"></span>
      </div>
    </header>

    <div class="flex-1 flex flex-col justify-center items-center px-8 md:px-16 py-12 max-w-6xl mx-auto w-full" id="slideArea"></div>

    <footer class="h-20 px-8 flex items-center justify-between border-t border-slate-800/50 bg-slate-900/20 shrink-0">
      <button id="prevBtn" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition font-bold text-sm disabled:opacity-30 group" disabled>
        <svg class="group-hover:-translate-x-1 transition-transform" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Previous
      </button>
      <div class="hidden md:flex gap-1 flex-wrap justify-center max-w-xs" id="dotNav"></div>
      <button id="nextBtn" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white transition font-bold text-sm shadow-lg shadow-indigo-900/50 group">
        Next
        <svg class="group-hover:translate-x-1 transition-transform" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </footer>
  </main>
</div>

<div id="overlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden" onclick="toggleSidebar(false)"></div>

<script>
const schedule = [
  // WEEK 12
  { wk:12, day:"Wed 4/1",  title:"Brand Identity Intro",      task:"Campaign piece planning & brand identity introduction", intention:"We are learning to create promotional graphics that maintain a consistent brand identity across multiple pieces." },
  { wk:12, day:"Thu 4/2",  title:"Album Cover Studio",        task:"Album cover production studio", intention:"We are learning to create promotional graphics that maintain a consistent brand identity across multiple pieces." },
  { wk:12, day:"Fri 4/3",  title:"No School",                 task:"No School — Good Friday", intention:"", noSchool:true },
  { wk:12, day:"Mon 4/6",  title:"Merch Production",          task:"Merchandise and sticker production", intention:"We are learning to create promotional graphics that maintain a consistent brand identity across multiple pieces." },
  { wk:12, day:"Tue 4/7",  title:"Consistency Check",         task:"Consistency check across pieces", intention:"We are learning to create promotional graphics that maintain a consistent brand identity across multiple pieces." },
  { wk:12, day:"Wed 4/8",  title:"Export Checkpoint",         task:"Export and checkpoint submission", intention:"We are learning to create promotional graphics that maintain a consistent brand identity across multiple pieces." },
  // WEEK 13
  { wk:13, day:"Thu 4/9",  title:"GMetrix Setup & Baseline",  task:"Account setup: gmetrix.net → Sign up → redeem access code with the light-blue key icon. Then open GMetrix SMS v6 → Sign in → New Test → Adobe Photoshop → Training Mode baseline. Record score in workbook.", intention:"We are learning to navigate the GMetrix certification platform and establish baseline scores to guide targeted practice." },
  { wk:13, day:"Fri 4/10", title:"Peer Critique",             task:"Peer critique on promotional graphics", intention:"We are learning to introduce the certification platform, analyze design work, and use feedback to improve clarity." },
  { wk:13, day:"Mon 4/13", title:"Revision Studio",           task:"Revision studio based on feedback", intention:"We are learning to introduce the certification platform, analyze design work, and use feedback to improve clarity." },
  { wk:13, day:"Tue 4/14", title:"Final Revisions",           task:"Final revisions, export check, and reflection submission", intention:"We are learning to introduce the certification platform, analyze design work, and use feedback to improve clarity." },
  // WEEK 14
  { wk:14, day:"Wed 4/15", title:"File Organization",         task:"Asset collection and file organization", intention:"We are learning to organize work professionally and build foundational Photoshop certification skills." },
  { wk:14, day:"Thu 4/16", title:"Portfolio Layout",          task:"Portfolio layout preparation", intention:"We are learning to organize work professionally and build foundational Photoshop certification skills." },
  { wk:14, day:"Fri 4/17", title:"ACE Practice Baseline",     task:"GMetrix SMS: New Test → Adobe → Photoshop → Testing Mode baseline (timed, no help). Submit for score report, then switch to Training Mode with lightbulb help for Video Q1-Q8 (0:03-2:10).", intention:"We are learning to organize work professionally and build foundational Photoshop certification skills." },
  { wk:14, day:"Mon 4/20", title:"Layout Review",             task:"Layout review & distribute Supplementary Study Guide", intention:"We are learning to organize work professionally and build foundational Photoshop certification skills." },
  { wk:14, day:"Tue 4/21", title:"Layers/Masks Practice",     task:"GMetrix Practice: Layers/Masks & Practice Video Q9-Q16 (2:11-4:18)", intention:"We are learning to organize work professionally and build foundational Photoshop certification skills." },
  // WEEK 15
  { wk:15, day:"Wed 4/22", title:"Concept Expansion",         task:"Concept expansion for target audiences", intention:"We are learning to refine design concepts and apply advanced technical skills for certification." },
  { wk:15, day:"Thu 4/23", title:"Refinement Studio",         task:"Refinement studio work", intention:"We are learning to refine design concepts and apply advanced technical skills for certification." },
  { wk:15, day:"Fri 4/24", title:"No School",                 task:"No Student Attendance — Institute Day", intention:"", noSchool:true },
  { wk:15, day:"Mon 4/27", title:"Typography Practice",       task:"GMetrix Practice: Adjustments/Typography & Practice Video Q17-Q25 (4:19-6:42)", intention:"We are learning to refine design concepts and apply advanced technical skills for certification." },
  { wk:15, day:"Tue 4/28", title:"Peer Check",                task:"Peer check and refinement studio", intention:"We are learning to refine design concepts and apply advanced technical skills for certification." },
  { wk:15, day:"Wed 4/29", title:"Practice Exam",             task:"GMetrix Practice Exam, Practice Video Q26-Q33 (6:43-8:50), & Video Answer Key", intention:"We are learning to refine design concepts and apply advanced technical skills for certification." },
  // WEEK 16
  { wk:16, day:"Thu 4/30", title:"Export Packaging",          task:"Proofing, formatting, and export packaging", intention:"We are learning to complete and package work while targeting weak areas for the certification exam." },
  { wk:16, day:"Fri 5/1",  title:"Targeted Review",          task:"Targeted Review: GMetrix weak areas & Video Answer Key deep dive", intention:"We are learning to complete and package work while targeting weak areas for the certification exam." },
  { wk:16, day:"Mon 5/4",  title:"Final Submission",          task:"Final project submission and packaging", intention:"We are learning to complete and package work while targeting weak areas for the certification exam." },
  { wk:16, day:"Tue 5/5",  title:"Exam Strategy",             task:"Exam strategy and final testing interface review", intention:"We are learning to complete and package work while targeting weak areas for the certification exam." },
  // WEEK 17
  { wk:17, day:"Wed 5/6",  title:"EXAM DAY 1",                task:"GD1: Official Practice Exam | GD2: Adobe Photoshop Certification Exam", intention:"We are learning to execute certification exams and reflect on the design process.", exam:true },
  { wk:17, day:"Thu 5/7",  title:"EXAM DAY 2",                task:"GD1: Finish Practice | GD2: Finish Certification", intention:"We are learning to execute certification exams and reflect on the design process.", exam:true },
  { wk:17, day:"Fri 5/8",  title:"Exam Reflection",           task:"Written reflection on design process and exam experience", intention:"We are learning to execute certification exams and reflect on the design process." },
  { wk:17, day:"Mon 5/11", title:"Portfolio Sharing",         task:"Peer sharing and documentation of final portfolio", intention:"We are learning to execute certification exams and reflect on the design process." },
  // WEEK 18
  { wk:18, day:"Tue 5/12", title:"Industry Pathways",         task:"Industry exploration and professional pathways", intention:"We are learning to explore how graphic design skills relate to real-world applications and professional pathways." },
  { wk:18, day:"Wed 5/13", title:"Workspace Archive",         task:"Digital workspace cleanup, archive, and backup", intention:"We are learning to explore how graphic design skills relate to real-world applications and professional pathways." },
  { wk:18, day:"Thu 5/14", title:"Semester Wrap-Up",          task:"Semester wrap-up", intention:"We are learning to explore how graphic design skills relate to real-world applications and professional pathways." }
];

let current = 0;

function renderSlide() {
  const s = schedule[current];
  document.getElementById('weekBadge').textContent = `Week ${s.wk}`;
  document.getElementById('dateBadge').textContent = s.day;
  document.getElementById('counterBadge').textContent = `${current+1} / ${schedule.length}`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === schedule.length-1 ? 'Start Over' : 'Next';
  document.getElementById('nextBtn').onclick = () => { if (current < schedule.length-1) current++; else current=0; renderSlide(); updateNav(); };

  const dots = document.getElementById('dotNav');
  dots.innerHTML = '';
  schedule.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = `h-1.5 rounded-full transition-all duration-300 cursor-pointer ${i===current ? 'w-6 bg-indigo-500' : 'w-1.5 bg-slate-700 hover:bg-slate-500'}`;
    d.onclick = () => { current = i; renderSlide(); };
    dots.appendChild(d);
  });

  const area = document.getElementById('slideArea');
  const taskText = `${s.title} ${s.task}`.toLowerCase();
  const isHelpDay = ['gmetrix', 'ace', 'study guide', 'practice exam', 'certification'].some(keyword => taskText.includes(keyword));
  const isSetupDay = /gmetrix setup|baseline/.test(taskText);
  const protocolBanner = isSetupDay ? `
      <div class="mx-auto max-w-3xl rounded-[1.75rem] border border-emerald-500/20 bg-emerald-500/10 px-5 py-4 text-left">
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-emerald-300 mb-2">48-Minute Classroom Protocol</p>
        <p class="text-sm text-slate-200 leading-relaxed">0–15 min: account setup + code redemption. 15–25 min: SMS launch + sign-in. 25–40 min: baseline test. 40–48 min: save progress and record scores.</p>
      </div>` : '';
  const officialHelpBanner = isHelpDay ? `
      <div class="mx-auto max-w-3xl rounded-[1.75rem] border border-indigo-500/20 bg-indigo-500/10 px-5 py-4 text-left">
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-300 mb-2">Official GMetrix Help</p>
        <p class="text-sm text-slate-200 leading-relaxed">Need login, access-code, or study-help support? Use the official portal, support center, and Study Guide articles.</p>
        <div class="mt-3 flex flex-wrap gap-2">
          <a href="https://www.gmetrix.net/" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs font-bold text-slate-200 hover:border-indigo-500/40 hover:text-white transition">Portal</a>
          <a href="https://support.gmetrix.net/support/home" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs font-bold text-slate-200 hover:border-indigo-500/40 hover:text-white transition">Support</a>
          <a href="https://support.gmetrix.net/support/solutions/folders/67000581285" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-xs font-bold text-indigo-300 hover:bg-indigo-500/20 transition">Study Guide</a>
        </div>
      </div>` : '';
  if (s.noSchool) {
    area.innerHTML = `
      <div class="slide-enter w-full space-y-8 text-center">
        <span class="inline-block px-4 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-500 text-sm font-bold uppercase tracking-[0.2em]">No School</span>
        <h1 class="text-6xl md:text-8xl font-black text-slate-600 leading-none">${s.title}</h1>
        <p class="text-slate-500 text-2xl">${s.task}</p>
      </div>`;
    return;
  }

  const examBg = s.exam ? 'bg-indigo-950/40 border-indigo-500/30' : 'bg-slate-900 border-slate-800 hover:border-indigo-500/30';
  area.innerHTML = `
    <div class="slide-enter w-full space-y-10 text-center">
      <div class="space-y-3">
        <span class="inline-block px-4 py-1 rounded-full ${s.exam ? 'bg-indigo-500/20 border-indigo-400/30 text-indigo-300' : 'bg-indigo-500/10 border-indigo-500/20 text-indigo-400'} border text-sm font-bold uppercase tracking-[0.2em]">${s.exam ? '⚡ Exam Day' : "Today's Focus"}</span>
        <h1 class="text-5xl md:text-7xl font-black text-white leading-tight tracking-tighter">${s.title}</h1>
        ${officialHelpBanner}\n          ${protocolBanner}
      </div>
      <div class="grid md:grid-cols-2 gap-6 w-full text-left">
        <div class="${examBg} p-8 rounded-[2rem] shadow-2xl transition-all group border">
          <div class="flex items-center gap-3 mb-5">
            <div class="p-3 bg-indigo-500/10 rounded-2xl group-hover:bg-indigo-500/20 transition-colors">
              <svg width="24" height="24" fill="none" stroke="#818cf8" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
            </div>
            <h3 class="text-xl font-black text-white">Class Activities</h3>
          </div>
          <p class="text-xl text-slate-300 leading-relaxed min-h-[8rem]">${s.task}</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 hover:border-emerald-500/30 p-8 rounded-[2rem] shadow-2xl transition-all group">
          <div class="flex items-center gap-3 mb-5">
            <div class="p-3 bg-emerald-500/10 rounded-2xl group-hover:bg-emerald-500/20 transition-colors">
              <svg width="24" height="24" fill="none" stroke="#34d399" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h3 class="text-xl font-black text-white">Learning Intention</h3>
          </div>
          <p class="text-xl text-slate-300 leading-relaxed italic min-h-[8rem]">"${s.intention}"</p>
        </div>
      </div>
    </div>`;
}

function buildNav() {
  const container = document.getElementById('navList');
  const weeks = [...new Set(schedule.map(s=>s.wk))];
  weeks.forEach(wk => {
    const section = document.createElement('div');
    section.className = 'space-y-1';
    section.innerHTML = `<p class="text-[10px] font-black uppercase tracking-widest text-slate-500 px-3 mb-2">Week ${wk}</p>`;
    schedule.forEach((s,i) => {
      if (s.wk !== wk) return;
      const btn = document.createElement('button');
      btn.id = `navBtn_${i}`;
      btn.className = `w-full text-left px-3 py-2 rounded-lg text-sm transition-all ${i===current ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`;
      btn.innerHTML = `<div class="flex items-center gap-2"><span class="text-[10px] opacity-60 w-12 shrink-0">${s.day}</span><span class="truncate">${s.title}</span></div>`;
      btn.onclick = () => { current = i; renderSlide(); updateNav(); toggleSidebar(false); };
      section.appendChild(btn);
    });
    container.appendChild(section);
  });
}

function updateNav() {
  schedule.forEach((_,i) => {
    const btn = document.getElementById(`navBtn_${i}`);
    if (!btn) return;
    btn.className = `w-full text-left px-3 py-2 rounded-lg text-sm transition-all ${i===current ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`;
  });
}

function toggleSidebar(open) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (open) { sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); }
  else { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); }
}

document.getElementById('prevBtn').onclick = () => { if (current > 0) { current--; renderSlide(); updateNav(); } };
document.getElementById('openSidebar').onclick = () => toggleSidebar(true);
document.getElementById('closeSidebar').onclick = () => toggleSidebar(false);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (current < schedule.length-1) current++; else current=0; renderSlide(); updateNav(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (current > 0) current--; renderSlide(); updateNav(); }
});

buildNav();
renderSlide();
</script>
</body>
</html>
