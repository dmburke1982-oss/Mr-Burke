  </div>
  <h1 class="text-5xl font-black uppercase tracking-widest border-b-8 border-gray-900 pb-6 mb-8 text-center">Basic Box<br>Workbook</h1>
  <p class="text-gray-500 font-bold uppercase tracking-widest text-sm mb-10">Woodworking · Weeks 12–18 · Spring 2026</p>
  <div class="w-full max-w-md space-y-5 text-lg">
    <div>
      <label class="block font-bold mb-1 text-gray-600">Student Name:</label>
      <input type="text" class="w-full border-b-4 border-gray-400 outline-none p-2 bg-gray-50"/>

    </div>
    <!-- Response Area -->

      ${data.type === 'sketch' ? `

            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 20H7L3 16l9-9 8 8-2 2z"/><path d="M6 11l5-5"/></svg> Clear

// Canvas logic
const canvases = {};
function initCanvas(id) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const container = canvas.parentElement;
  canvas.width = container.offsetWidth * 2;
  canvas.height = container.offsetHeight * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1f2937';
  ctx.lineWidth = 2;
  canvases[id] = { canvas, ctx, drawing: false };

  const getPos = (e) => {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return [src.clientX - r.left, src.clientY - r.top];
  };
  canvas.addEventListener('mousedown', e => { const [x,y] = getPos(e); ctx.beginPath(); ctx.moveTo(x,y); canvases[id].drawing=true; });
  canvas.addEventListener('mousemove', e => { if (!canvases[id].drawing) return; const [x,y] = getPos(e); ctx.lineTo(x,y); ctx.stroke(); });
  canvas.addEventListener('mouseup', () => canvases[id].drawing=false);
  canvas.addEventListener('mouseleave', () => canvases[id].drawing=false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); const [x,y] = getPos(e); ctx.beginPath(); ctx.moveTo(x,y); canvases[id].drawing=true; }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!canvases[id].drawing) return; const [x,y] = getPos(e); ctx.lineTo(x,y); ctx.stroke(); }, {passive:false});
  canvas.addEventListener('touchend', () => canvases[id].drawing=false);
}

function clearSketch(id) {
  const c = canvases[id];
  if (!c) return;
  c.ctx.clearRect(0, 0, c.canvas.width, c.canvas.height);
}
</script>
